<nav class="bg-white dark:bg-slate-800 shadow-lg border-b
            border-slate-200 dark:border-slate-700
            mt-4 mb-8 rounded-2xl transition-colors duration-300"
     th:fragment="navbar"
     xmlns:th="http://www.thymeleaf.org">

  <div class="container mx-auto px-4">
    <div class="flex items-center justify-between py-4">

      <!-- Logo -->
      <a href="/"
         class="text-blue-600 dark:text-blue-400 font-bold text-xl
                      hover:text-blue-700 dark:hover:text-blue-300 transition-colors">
        YouTube Tools
      </a>

      <!-- Desktop Nav -->
      <div class="hidden md:flex items-center gap-4">

        <a href="/"
           class="nav-link"
           th:classappend="${activePage} == 'home'
                   ? 'active-link'">
          SEO Tags
        </a>

        <a href="/thumbnail"
           class="nav-link"
           th:classappend="${activePage} == 'thumbnails'
                   ? 'active-link'">
          Thumbnails
        </a>

        <a href="/video-details"
           class="nav-link"
           th:classappend="${activePage} == 'video'
                   ? 'active-link'">
          Video Data
        </a>

        <!-- Theme Toggle -->
        <button id="themeToggle"
                type="button"
                class="w-10 h-10 flex items-center justify-center
                               border border-blue-600 dark:border-blue-400
                               text-blue-600 dark:text-blue-400
                               hover:bg-blue-600 hover:text-white
                               dark:hover:bg-blue-400 dark:hover:text-slate-900
                               rounded-lg transition-all">
          <i id="themeIcon" class="bi bi-sun-fill"></i>
        </button>
      </div>

      <!-- Mobile Menu Button -->
      <button id="menuToggle"
              class="md:hidden w-10 h-10 flex items-center justify-center
                           border border-slate-300 dark:border-slate-600
                           rounded-lg text-slate-700 dark:text-slate-300">
        <i class="bi bi-list text-2xl"></i>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div id="mobileMenu"
         class="hidden md:hidden flex-col gap-2 pb-4">

      <a href="/"
         class="mobile-link"
         th:classappend="${activePage} == 'home' ? 'active-mobile'">
        SEO Tags
      </a>

      <a href="/thumbnail"
         class="mobile-link"
         th:classappend="${activePage} == 'thumbnails' ? 'active-mobile'">
        Thumbnails
      </a>

      <a href="/video-details"
         class="mobile-link"
         th:classappend="${activePage} == 'video' ? 'active-mobile'">
        Video Data
      </a>

      <!-- Mobile Theme Toggle -->
      <button id="themeToggleMobile"
              class="w-full flex items-center justify-center gap-2
                           border border-blue-600 dark:border-blue-400
                           text-blue-600 dark:text-blue-400
                           hover:bg-blue-600 hover:text-white
                           dark:hover:bg-blue-400 dark:hover:text-slate-900
                           rounded-lg py-2 transition-all">
        <i id="themeIconMobile" class="bi bi-sun-fill"></i>
        Toggle Theme
      </button>
    </div>
  </div>

  <!-- Styles -->
  <style>
    .nav-link {
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        color: #334155;
    }

    .dark .nav-link {
        color: #cbd5f5;
    }

    .nav-link:hover {
        color: #2563eb;
    }

    .active-link {
        color: #2563eb !important;
        font-weight: 600;
        background: rgba(37,99,235,.1);
    }

    .mobile-link {
        padding: 0.75rem;
        border-radius: 0.5rem;
        color: #334155;
    }

    .dark .mobile-link {
        color: #cbd5f5;
    }

    .active-mobile {
        background: rgba(37,99,235,.1);
        font-weight: 600;
    }
  </style>

  <!-- Scripts -->
  <script>
    const html = document.documentElement;

    const toggleTheme = (iconEl) => {
        if (html.classList.contains('dark')) {
            html.classList.remove('dark');
            localStorage.setItem('theme', 'light');
            iconEl.className = 'bi bi-sun-fill';
        } else {
            html.classList.add('dark');
            localStorage.setItem('theme', 'dark');
            iconEl.className = 'bi bi-moon-fill';
        }
    };

    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeToggleMobile = document.getElementById('themeToggleMobile');
    const themeIconMobile = document.getElementById('themeIconMobile');

    if (localStorage.getItem('theme') === 'dark') {
        html.classList.add('dark');
        themeIcon.className = 'bi bi-moon-fill';
        themeIconMobile.className = 'bi bi-moon-fill';
    }

    themeToggle?.addEventListener('click', () => toggleTheme(themeIcon));
    themeToggleMobile?.addEventListener('click', () => toggleTheme(themeIconMobile));

    const menuToggle = document.getElementById('menuToggle');
    const mobileMenu = document.getElementById('mobileMenu');

    menuToggle.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
    });
  </script>
</nav>
