<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Video Data Retriever</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    primary: {
                        500: '#2563eb',
                        600: '#1d4ed8'
                    },
                    accent: '#22c55e'
                }
            }
        }
    }
  </script>

  <style>
    .main-title {
        background: linear-gradient(90deg, #2563eb, #22c55e);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .gradient-header {
        background: linear-gradient(135deg, rgba(37,99,235,.08), rgba(34,197,94,.08));
        border: 1px dashed #e2e8f0;
    }

    .thumb-box {
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        overflow: hidden;
    }

    .desc-box {
        word-break: break-word;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
    }

    .tag {
        max-width: 100%;
        word-break: break-word;
    }

    .error {
        background: rgba(239, 68, 68, 0.12);
        color: #ef4444;
        border-left: 4px solid #ef4444;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen dark:bg-slate-900 dark:text-slate-100">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}" th:with="activePage='video'"></div>

<div class="container mx-auto px-4 max-w-3xl mt-12 pb-12">

  <!-- Header -->
  <div class="text-center mb-10">
    <h1 class="main-title text-4xl md:text-5xl font-extrabold mb-4">
      YouTube Video Data Retriever
    </h1>
    <div class="gradient-header rounded-xl p-4 mt-6">
      <p class="text-slate-600 dark:text-slate-400 text-lg">
        Enter a YouTube video URL or ID to fetch complete video information.
      </p>
    </div>
  </div>

  <!-- Form -->
  <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-lg p-6 mb-10">
    <form th:action="@{/youtube/video-details}" method="post">
      <label class="block text-sm font-medium mb-2">
        YouTube Video URL or ID
      </label>

      <input type="text"
             name="videoUrlOrId"
             th:value="${videoUrlOrId}"
             required
             class="w-full px-4 py-3 mb-4 rounded-lg border border-slate-300
                          dark:border-slate-600 bg-white dark:bg-slate-700">

      <button type="submit"
              class="bg-blue-600 hover:bg-blue-700 text-white font-medium
                           py-3 px-6 rounded-lg shadow-lg">
        Fetch Video Data
      </button>
    </form>

    <div th:if="${error}" class="error rounded-lg p-4 mt-4" th:text="${error}"></div>
  </div>

  <!-- Result -->
  <div th:if="${videoDetails != null}">
    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-lg p-6">

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 min-w-0">

        <!-- Thumbnail -->
        <div>
          <div class="thumb-box">
            <img th:src="${videoDetails.thumbnailUrl}"
                 th:alt="${videoDetails.title}"
                 class="w-full h-auto block">
          </div>

          <div class="mt-4 text-right">
            <a th:href="${videoDetails.thumbnailUrl}"
               th:download="${videoDetails.title + '-thumbnail.jpg'}"
               class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700
                                  text-white text-sm px-4 py-2 rounded-lg">
              <i class="bi bi-download"></i> Download
            </a>
          </div>
        </div>

        <!-- Details -->
        <div class="min-w-0">
          <h2 class="font-bold text-lg mb-2 break-words">
            <i class="bi bi-film text-blue-500"></i>
            <span th:text="${videoDetails.title}"></span>
          </h2>

          <div class="text-slate-600 dark:text-slate-400 mb-4 text-sm break-words">
            <i class="bi bi-person-video"></i>
            <span th:text="${videoDetails.channelTitle}"></span>
            &bull;
            <i class="bi bi-calendar3"></i>
            <span th:text="${videoDetails.publishedAt}"></span>
          </div>

          <!-- Description -->
          <h3 class="font-bold mb-2">
            <i class="bi bi-text-paragraph text-blue-500"></i> Description
          </h3>

          <div class="desc-box text-sm text-slate-700 dark:text-slate-300
                                max-h-48 overflow-y-auto pr-2 mb-6">
            <span th:text="${videoDetails.description != null ? videoDetails.description : 'No description available.'}"></span>
          </div>

          <!-- Tags -->
          <h3 class="font-bold mb-2">
            <i class="bi bi-tags text-blue-500"></i> Tags
          </h3>

          <div th:if="${videoDetails.tags.size() > 0}">
                        <span th:each="tag : ${videoDetails.tags}"
                              class="tag inline-flex items-center gap-1 rounded-full
                                     bg-slate-200 dark:bg-slate-700 px-3 py-1
                                     mr-2 mb-2 text-sm break-all">
                            <i class="bi bi-hash"></i>
                            <span th:text="${tag}"></span>
                        </span>
          </div>

          <div th:if="${videoDetails.tags.size() == 0}"
               class="text-slate-500 italic">
            No tags available.
          </div>

        </div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
